name: Portfolio visual smoke QA

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'index-ar.html'
      - 'work.html'
      - 'work-ar.html'
      - 'portfolio.html'
      - 'portfolio-ar.html'
      - 'assets/studio-v6.css'
      - 'scripts/qa-v6.mjs'
      - '.github/workflows/portfolio-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runner
        run: |
          npm install --no-save playwright
          npx playwright install chromium
      - name: Test portfolio layouts and links
        run: node scripts/qa-v6.mjs
      - name: Upload QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-qa-screenshots
          path: qa-screenshots/
          if-no-files-found: ignore
